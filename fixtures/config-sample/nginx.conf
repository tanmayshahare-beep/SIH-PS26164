# Nginx TLS configuration for CBOMScan testing

server {
    listen 443 ssl http2;
    server_name example.com;

    # SSL Certificate and Key
    ssl_certificate     /etc/ssl/certs/example.com.crt;
    ssl_certificate_key /etc/ssl/private/example.com.key;

    # TLS Protocols - includes deprecated versions (should be flagged)
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;

    # SSL Ciphers - includes weak ciphers (should be flagged)
    ssl_ciphers 'ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA:ECDHE-RSA-AES256-SHA:RC4:DES-CBC3-SHA';

    # Prefer server ciphers
    ssl_prefer_server_ciphers on;

    # SSL Session Cache
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# Another server with modern config (should still be flagged for review)
server {
    listen 8443 ssl http2;
    server_name api.example.com;

    ssl_certificate     /etc/ssl/certs/api.example.com.crt;
    ssl_certificate_key /etc/ssl/private/api.example.com.key;

    # Modern TLS protocols only
    ssl_protocols TLSv1.2 TLSv1.3;

    # Strong ciphers only
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';

    ssl_prefer_server_ciphers off;

    location / {
        proxy_pass http://api-backend;
    }
}