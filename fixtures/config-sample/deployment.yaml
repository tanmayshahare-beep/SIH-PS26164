# Kubernetes deployment with KMS references for CBOMScan testing

apiVersion: v1
kind: Namespace
metadata:
  name: app-prod
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: app-prod
  annotations:
    # AWS KMS reference
    kms.amazonaws.com/key-id: "arn:aws:kms:us-east-1:123456789012:key/12345678-1234-1234-1234-123456789012"
    # Azure Key Vault reference
    azure.microsoft.com/keyvault-name: "app-keyvault"
    # GCP KMS reference
    cloud.google.com/kms-key: "projects/my-project/locations/global/keyRings/app-keyring/cryptoKeys/app-key"
type: Opaque
stringData:
  database-password: "secret-password"
  api-key: "secret-api-key"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: app-prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: app
          image: myapp:latest
          envFrom:
            - secretRef:
                name: app-secrets
          env:
            - name: AWS_KMS_KEY_ID
              value: "arn:aws:kms:us-east-1:123456789012:key/12345678-1234-1234-1234-123456789012"
            - name: AZURE_KEY_VAULT_URL
              value: "https://app-keyvault.vault.azure.net"
            - name: GCP_KMS_KEY
              value: "projects/my-project/locations/global/keyRings/app-keyring/cryptoKeys/app-key"
---
apiVersion: v1
kind: Service
metadata:
  name: app-service
  namespace: app-prod
spec:
  selector:
    app: myapp
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP