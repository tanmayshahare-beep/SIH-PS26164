[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cbomscan"
version = "0.1.0"
description = "Cryptographic Bill of Materials Scanner"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "tree-sitter>=0.21",
    "tree-sitter-python>=0.21",
    "tree-sitter-javascript>=0.20",
    "packaging>=23.0",
    "cryptography>=41.0",
    "python-hcl2>=3.0",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "jsonschema>=4.19",
    # Used directly to resolve the bundled CycloneDX schema's local $refs.
    "referencing>=0.30",
    # JsonV1Dot7 (CycloneDX 1.7 output) requires 8.x or newer.
    "cyclonedx-python-lib>=8.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.5",
]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
cbomscan = "cbomscan.__main__:main"
cbomscan-api = "cbomscan.api_server:app"

[tool.setuptools.packages.find]
exclude = ["fixtures*", "frontend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "TID", "ARG"]
ignore = ["SIM102", "SIM103", "TID252", "ARG001", "ARG002"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
